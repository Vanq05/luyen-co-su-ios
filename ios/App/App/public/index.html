<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0c12" />
    <title>Luyện Cổ Sư — Action Roguelike</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <main id="game-root">
      <canvas id="game-canvas" width="384" height="216"></canvas>
      <div id="hud-layer"></div>
      <div id="fusion-modal-root"></div>
      <div id="overlay-screen" class="is-open"></div>
    </main>

    <div id="portrait-guard">
      <div style="font-size: 16px; font-weight: 700; color: #d6b16a;">
        Xoay ngang thiết bị để luyện cổ thuận tay nhất
      </div>
      <div style="font-size: 12px; color: #968fa3; max-width: 280px;">
        Luyện Cổ Sư được thiết kế theo bố cục ngang (Joystick trái · 4 Cổ Trùng phải).
      </div>
      <button id="portrait-dismiss" type="button">Tiếp tục</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
