<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0c12" />
    <title>Luyện Cổ Sư — Action Roguelike</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <main id="game-root">
      <canvas id="game-canvas" width="384" height="216"></canvas>
      <div id="hud-layer"></div>
      <div id="fusion-modal-root"></div>
      <div id="account-modal-root"></div>
      <div id="overlay-screen" class="is-open">
        <div class="overlay-card gate-boot-card">
          <div class="overlay-badge">DARK FANTASY PIXEL ROGUELIKE</div>
          <h1 class="overlay-title">LUYỆN CỔ SƯ</h1>
          <p class="overlay-sub">Chạy `npm run build` hoặc `npm run dev` để mở bản bundle iOS/Web.</p>
        </div>
      </div>
    </main>
  </body>
</html>
